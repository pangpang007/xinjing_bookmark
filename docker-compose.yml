services:
  redis:
    image: redis:7-alpine
    container_name: bookjie-redis
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    image: bookjie-api:latest
    container_name: bookjie-api
    ports:
      - "8082:8080"
    env_file:
      - .env
    environment:
      PORT: 8080
      REDIS_URL: redis://redis:6379/0
      TZ: Asia/Shanghai
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redisdata:
